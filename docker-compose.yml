
services:

  database:
    image: postgres:18
    container_name: photography-db
    environment:
      POSTGRES_DB: photographydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - photography_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d photographydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/PhotographyPackageBackend
    container_name: photography-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/photographydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: photography-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  photography_data:
